name: News item from issue

# Opening an issue with the "News item" form (.github/ISSUE_TEMPLATE/0_news_item.yml) adds it to the site:
# the item is committed to _news/, the image to assets/img/news/, the site is rebuilt and the issue is closed.
# Only issues opened by the repository owner are used. Anyone else's are ignored.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: news-from-issue
  cancel-in-progress: false

jobs:
  add-news:
    if: github.event.issue.user.login == github.repository_owner && contains(github.event.issue.body, '### Image type')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Write the news item
        id: news
        run: python3 .github/scripts/news_from_issue.py "$GITHUB_EVENT_PATH"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _news assets/img/news
          git commit -m "Add news item from #$ISSUE_NUMBER"
          git push
      # Pushes made by this workflow don't start other workflows, so start the deploy explicitly.
      - name: Rebuild the site
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
      - name: Close the issue
        env:
          FILE: ${{ steps.news.outputs.file }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Added as \`$FILE\`. The site will update in a few minutes."
      - name: Report a failure
        if: failure()
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "This news item couldn't be added. The error is in the run log, $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Fix the issue text, then open a new issue."
