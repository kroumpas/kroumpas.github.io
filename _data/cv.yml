    # ------------------------------------------------------------
    Projects:
      - name: Gaze Reconstruction as Cognitive-State Measurement
        start_date: 2024
        end_date: present
        summary: >-
          Physics-informed neural network in PyTorch that reconstructs expected gaze from
          eye-tracking data. Deviation from the reconstruction serves as a measure of attention
          lapse rather than as tracking error.
        highlights:
          - Multi-head architecture embedding oculomotor dynamics as constraints in the training objective.
          - Outperformed a conventional neural baseline; vertical-gaze R-squared 0.85 to 0.91.
          - Published in Expert Systems with Applications (2025).

      - name: CourseCrafter — AI-Assisted Course Authoring
        start_date: 2024
        end_date: 2025
        summary: >-
          Authoring tool that lets educators build Minecraft Education courses without coding
          or prior familiarity with the platform's controls.
        highlights:
          - Evaluated with 10 educators across geographies, grade levels and subjects.
          - Mixed-methods evaluation using the System Usability Scale and semi-structured interviews.
          - Design published at WAIE 2024; evaluation published at AICCONF 2025.

      - name: Blink-Based Hands-Free Input
        start_date: 2025
        end_date: present
        summary: >-
          Method separating voluntary from involuntary blinks so that blinks can serve as a
          reliable input channel, validated as robust under induced stress.
        highlights:
          - Two-component Gaussian mixture model over blink duration establishes the classification boundary.
          - Stress manipulation validated physiologically via pupil diameter; the boundary held.
          - Open dataset and model published on Zenodo.

      - name: Research Dashboards & Operational Interfaces
        start_date: 2023
        end_date: present
        summary: >-
          Interface design work turning dense, multi-source data into something people can read
          and act on, across EU research projects and operational contexts.
        highlights:
          - SCUDO — dashboard unifying multi-source EU project data into a single readable view.
          - Search-and-rescue flight map, designed for legibility under time pressure.
          - Adaptive lecture platform for a relativistic quantum mechanics course.
          - All designed in Figma.

