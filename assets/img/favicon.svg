<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Gaze on a sphere</title>
  <defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d7e62"/><stop offset="1" stop-color="#766443"/></linearGradient></defs>
  <style>.ln{fill:none;stroke:#141414}
.iris{fill:url(#ig);stroke:#2b2418;stroke-width:.6}
.pupil{fill:#060606}
.a1{stroke:#bd582c}.a1f{fill:#bd582c}
.a2{stroke:#084d6e}.a2f{fill:#084d6e}
@media (prefers-color-scheme:dark){
.ln{stroke:#d0d0d0}
.a2{stroke:#3a8fbc}.a2f{fill:#3a8fbc}
}</style>
  <circle class="ln" cx="32" cy="32" r="27" stroke-width="4"/>
  <circle class="iris" cx="46.6" cy="28.8" r="9.6"/>
  <circle class="pupil" cx="47.1" cy="28.5" r="3.2"/>
  <path class="a1" fill="none" stroke-width="4" stroke-linecap="round" d="M32,5 C41,5 45.24,8.23 46.6,14.28"/>
  <polygon class="a1f" points="48.2,21.4 41.26,14.25 51.41,11.97"/>
  <path class="a2" fill="none" stroke-width="4" stroke-linecap="round" d="M5,32 C6.2,28.8 20.7,28.87 31.9,28.65"/>
  <polygon class="a2f" points="39.2,28.5 30.81,33.87 30.6,23.47"/>
</svg>
